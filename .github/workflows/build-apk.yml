          cat > 'app/src/main/java/com/ninjaball/game/MainActivity.java' <<'__EOF__'
          package com.ninjaball.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;
              private Bridge bridge;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);          // localStorage = save data
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  bridge = new Bridge(this, web);
                  web.addJavascriptInterface(bridge, "NinjaNative");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onWindowFocusChanged(boolean f) {
                  super.onWindowFocusChanged(f);
                  if (f) web.setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("(function(){try{if(cur=='home')return 'exit';goBack();return 'ok'}catch(e){return 'exit'}})()", new ValueCallback<String>() {
                      public void onReceiveValue(String v) {
                          if (v == null || v.contains("exit")) finish();
                      }
                  });
              }

              @Override
              protected void onDestroy() {
                  if (bridge != null) bridge.shutdown();
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          __EOF__
          mkdir -p app/src/main/assets app/src/main/res/drawable
          cp "$GITHUB_WORKSPACE/index.html" app/src/main/assets/index.html
          cp "$GITHUB_WORKSPACE/ninja_ball_icon.png" app/src/main/res/drawable/ic_launcher.png
          echo "Android project generated:"
          find . -type f | sort

      - name: Build APK
        working-directory: _android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NinjaBall-apk
          path: _android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
